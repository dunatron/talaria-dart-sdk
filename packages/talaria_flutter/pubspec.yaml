name: talaria_flutter
description: Flutter bindings for the Talaria SDK — error hooks, zone bootstrap, navigator observer, and lifecycle tags.
version: 0.1.0
homepage: https://www.newtalaria.com
repository: https://github.com/dunatron/talaria-dart-sdk
issue_tracker: https://github.com/dunatron/talaria-dart-sdk/issues
documentation: https://www.newtalaria.com/docs/sdk/flutter

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  talaria: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
