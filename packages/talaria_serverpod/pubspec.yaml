name: talaria_serverpod
description: Serverpod adapter for the Talaria SDK — endpoint, Postgres, and FutureCall tracing.
version: 0.3.0
homepage: https://www.newtalaria.com
repository: https://github.com/dunatron/talaria-dart-sdk
issue_tracker: https://github.com/dunatron/talaria-dart-sdk/issues
documentation: https://www.newtalaria.com/docs/sdk/serverpod
license: MIT
topics:
  - serverpod
  - error-tracking
  - logging
  - observability
  - tracing

environment:
  sdk: ^3.5.0

dependencies:
  serverpod: ^4.0.0
  # Published constraint. Local path is pubspec_overrides.yaml, not this file.
  talaria: ^0.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
