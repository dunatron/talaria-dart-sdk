name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  talaria:
    name: talaria (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/talaria
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  talaria_flutter:
    name: talaria_flutter (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/talaria_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
